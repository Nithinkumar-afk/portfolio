<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nithin Kumar | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Poppins",sans-serif;
  background:#120730;
  color:#fff;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:20px 50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}
header a{
  color:#fff;
  text-decoration:none;
  margin-left:30px;
  font-weight:600;
}
header a:hover{color:#d6c4ff;}

/* HOME SECTION */
#home{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:120px 0;
  background:linear-gradient(135deg,#130c3e,#5737ff);
}

/* Main Rounded Card */
.home-container{
  width:85%;
  max-width:1250px;
  background:#1b144a;
  border-radius:35px;
  padding:60px 70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.3);
}

/* Circular right background shape */
.circle-bg{
  position:absolute;
  right:-180px;
  top:50%;
  transform:translateY(-50%);
  width:470px;
  height:470px;
  border-radius:50%;
  background:#5737ff;
  opacity:0.9;
}

/* White ring circle */
.white-ring{
  position:absolute;
  right:-110px;
  top:50%;
  transform:translateY(-50%);
  width:350px;
  height:350px;
  border-radius:50%;
  border:3px solid #fff;
  opacity:0.8;
}

/* CONTENT */
.home-left{
  width:55%;
  z-index:10;
}
.home-left h1{
  font-size:3.4rem;
  font-weight:800;
  line-height:1.1;
}
.home-left h1 span{
  color:#d6c4ff;
}
.home-left h3{
  margin-top:10px;
  font-size:1.4rem;
  font-weight:600;
}
.home-left h3 span{
  background:#5737ff;
  padding:4px 10px;
  border-radius:5px;
}
.home-left p{
  margin-top:25px;
  line-height:1.7;
  color:#dcd9ff;
}

.btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 30px;
  background:#5737ff;
  color:#fff;
  font-weight:700;
  text-decoration:none;
  border-radius:10px;
  transition:0.3s;
}
.btn:hover{
  background:#6c4bff;
}

/* PROFILE IMAGE */
.home-right{
  width:45%;
  display:flex;
  justify-content:center;
  position:relative;
  z-index:11;
}
.home-right img{
  width:260px;
  height:260px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #fff;
  box-shadow:0 0 25px rgba(0,0,0,0.4);
  transition:0.3s ease;
}
.home-right img:hover{
  transform:scale(1.05);
}

/* RESPONSIVE */
@media(max-width:950px){
  .home-container{
    flex-direction:column;
    padding:60px 40px;
    text-align:center;
  }
  .home-left{
    width:100%;
  }
  .home-right{
    width:100%;
    margin-top:40px;
  }
  .circle-bg,.white-ring{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <h2 style="color:#fff;font-weight:800;">NILA</h2>
  <nav>
    <a href="#home">Home</a>
    <a href="#projects">Projects</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HOME SECTION -->
<section id="home">
  <div class="home-container">

    <!-- LEFT TEXT -->
    <div class="home-left">
      <h1>It's Me <span>Nithin<br>Kumar</span></h1>
      <h3>Front End <span>Web Developer</span></h3>
      <p>
        I craft clean, modern and efficient web experiences with smooth UI and 
        thoughtful design.  
      </p>
      <a href="#" class="btn">Download CV</a>
    </div>

    <!-- RIGHT IMAGE -->
    <div class="home-right">
      <img src="profile.png" alt="Nithin Kumar">
    </div>

    <!-- Circles -->
    <div class="circle-bg"></div>
    <div class="white-ring"></div>

  </div>
</section>

</body>
</html>
